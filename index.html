<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Song Memory Battle - Kahoot Edition</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Font: Nunito with full Vietnamese support -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --kahoot-red: #e21b3c;
      --kahoot-red-dark: #a01027;
      --kahoot-blue: #1368ce;
      --kahoot-blue-dark: #0b4386;
      --kahoot-yellow: #ffa602;
      --kahoot-yellow-dark: #b87400;
      --kahoot-green: #26890c;
      --kahoot-green-dark: #175407;
      --kahoot-purple: #46178f;
      --kahoot-purple-dark: #311064;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #46178f 0%, #250761 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before, body::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 70%);
      z-index: 0;
      pointer-events: none;
    }
    body::before { top: -60px; left: -80px; }
    body::after { bottom: -80px; right: -60px; }

    .quiz-card {
      background: #ffffff;
      color: #333333;
      border-radius: 28px;
      padding: 2rem 1.8rem;
      max-width: 720px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4), 0 8px 0 rgba(0, 0, 0, 0.15);
      position: relative;
      z-index: 1;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Welcome Screen Styles */
    .welcome-container {
      text-align: center;
      padding: 1.5rem 0.5rem;
    }
    .welcome-title {
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--kahoot-purple);
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    .welcome-subtitle {
      font-size: 1.15rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }
    .welcome-info-box {
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 18px;
      padding: 1.2rem;
      margin-bottom: 2rem;
      text-align: left;
    }
    .welcome-info-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 0.6rem;
    }
    .welcome-info-item:last-child {
      margin-bottom: 0;
    }
    .welcome-info-icon {
      font-size: 1.3rem;
    }
    .btn-start {
      width: 100%;
      background: var(--kahoot-green);
      box-shadow: 0 6px 0 var(--kahoot-green-dark);
      color: #ffffff;
      border: none;
      padding: 1.25rem 2rem;
      border-radius: 18px;
      font-family: inherit;
      font-size: 1.4rem;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: transform 0.08s, filter 0.15s, box-shadow 0.08s;
    }
    .btn-start:hover {
      filter: brightness(1.08);
    }
    .btn-start:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--kahoot-green-dark);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      gap: 0.75rem;
    }

    .pill-badge {
      font-size: 1.05rem;
      font-weight: 800;
      padding: 0.6rem 1.3rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    }
    .score-badge {
      background: #e0f2fe;
      color: #0369a1;
      border: 2px solid #bae6fd;
    }
    .streak-badge {
      background: #fef3c7;
      color: #b45309;
      border: 2px solid #fde68a;
    }

    .quote-box {
      background: #f8fafc;
      border: 3px solid #e2e8f0;
      border-radius: 20px;
      padding: 1.6rem 1.4rem;
      margin-bottom: 1.5rem;
      text-align: center;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
    }

    .quote-label {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 0.6rem;
    }

    .lyric-text {
      font-size: 1.35rem;
      line-height: 1.55;
      font-weight: 800;
      color: #0f172a;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }
      .quiz-card { padding: 1.5rem 1.1rem; }
      .lyric-text { font-size: 1.15rem; }
      .welcome-title { font-size: 2rem; }
    }

    .choice-btn {
      color: #ffffff;
      border: none;
      padding: 1.2rem 1.3rem;
      border-radius: 16px;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 800;
      text-align: center;
      justify-content: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      position: relative;
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease, background 0.2s ease;
      line-height: 1.35;
      user-select: none;
    }

    .choice-btn:nth-child(1) {
      background: var(--kahoot-red);
      box-shadow: 0 6px 0 var(--kahoot-red-dark);
    }
    .choice-btn:nth-child(2) {
      background: var(--kahoot-blue);
      box-shadow: 0 6px 0 var(--kahoot-blue-dark);
    }
    .choice-btn:nth-child(3) {
      background: var(--kahoot-yellow);
      box-shadow: 0 6px 0 var(--kahoot-yellow-dark);
    }
    .choice-btn:nth-child(4) {
      background: var(--kahoot-green);
      box-shadow: 0 6px 0 var(--kahoot-green-dark);
    }

    .choice-btn:hover:not(:disabled) {
      filter: brightness(1.08);
    }
    .choice-btn:active:not(:disabled) {
      transform: translateY(4px);
    }
    .choice-btn:nth-child(1):active:not(:disabled) { box-shadow: 0 2px 0 var(--kahoot-red-dark); }
    .choice-btn:nth-child(2):active:not(:disabled) { box-shadow: 0 2px 0 var(--kahoot-blue-dark); }
    .choice-btn:nth-child(3):active:not(:disabled) { box-shadow: 0 2px 0 var(--kahoot-yellow-dark); }
    .choice-btn:nth-child(4):active:not(:disabled) { box-shadow: 0 2px 0 var(--kahoot-green-dark); }

    .choice-btn.correct {
      background: #10b981 !important;
      box-shadow: 0 6px 0 #047857 !important;
      opacity: 1 !important;
      transform: scale(1.03);
      animation: bounceWin 0.4s ease;
    }
    .choice-btn.wrong {
      background: var(--kahoot-red) !important;
      box-shadow: 0 6px 0 var(--kahoot-red-dark) !important;
      opacity: 1 !important;
      transform: scale(0.98);
    }
    .choice-btn.dimmed {
      background: #64748b !important;
      box-shadow: 0 4px 0 #475569 !important;
      opacity: 0.35 !important;
      transform: scale(0.96) !important;
      filter: grayscale(80%) !important;
      cursor: default;
    }

    @keyframes bounceWin {
      0%, 100% { transform: scale(1.03); }
      50% { transform: scale(1.08); }
    }

    .game-over-header {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--kahoot-red);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .correct-answer-banner {
      background: #ecfdf5;
      border: 2px dashed #10b981;
      color: #065f46;
      border-radius: 14px;
      padding: 0.75rem 1rem;
      text-align: center;
      margin: 0.75rem 0 1.25rem 0;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .rank-badge-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 1rem auto 0.5rem auto;
    }

    .rank-badge-img {
      width: 220px;
      height: 220px;
      max-width: 100%;
      object-fit: contain;
      border-radius: 16px;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.25));
      animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .score-summary {
      text-align: center;
      font-size: 3rem;
      font-weight: 900;
      color: var(--kahoot-purple);
      margin: 0.25rem 0 1.25rem 0;
      letter-spacing: -0.02em;
    }

    .name-input-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      width: 100%;
    }

    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 0.95rem 1.1rem;
      border-radius: 14px;
      border: 3px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      font-size: 1.05rem;
      font-family: inherit;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--kahoot-blue);
    }

    .btn-save {
      width: 100%;
      box-sizing: border-box;
      background: var(--kahoot-green);
      box-shadow: 0 5px 0 var(--kahoot-green-dark);
      color: #fff;
      border: none;
      padding: 1rem 1.5rem;
      border-radius: 14px;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
    }
    .btn-save:hover {
      filter: brightness(1.08);
    }
    .btn-save:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--kahoot-green-dark);
    }

    .leaderboard-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: #1e293b;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    #board-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    
    .leaderboard-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 0.4rem;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .leaderboard-table th {
      color: #64748b;
      font-weight: 800;
      padding: 0.4rem 0.8rem;
      text-align: left;
    }

    .leaderboard-table tr td {
      background: #f8fafc;
      padding: 0.65rem 0.8rem;
      font-weight: 700;
      color: #1e293b;
    }
    .leaderboard-table tr td:first-child { border-radius: 10px 0 0 10px; }
    .leaderboard-table tr td:last-child { border-radius: 0 10px 10px 0; }

    .leaderboard-table tbody tr:nth-child(1) td {
      background: #fef9c3;
      color: #854d0e;
      font-weight: 900;
    }
    .leaderboard-table tbody tr:nth-child(2) td {
      background: #f1f5f9;
      color: #334155;
      font-weight: 800;
    }
    .leaderboard-table tbody tr:nth-child(3) td {
      background: #ffedd5;
      color: #9a3412;
      font-weight: 800;
    }

    .btn-restart {
      background: var(--kahoot-blue);
      box-shadow: 0 6px 0 var(--kahoot-blue-dark);
      color: #fff;
      border: none;
      padding: 1.1rem;
      border-radius: 16px;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
      letter-spacing: 0.02em;
      transition: transform 0.08s, filter 0.15s;
    }
    .btn-restart:hover { filter: brightness(1.08); }
    .btn-restart:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--kahoot-blue-dark);
    }

    /* History review section at bottom */
    .history-card {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 1.1rem 1.2rem;
      margin-top: 1.5rem;
    }
    .history-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 0.35rem;
    }
    .history-item {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
      font-size: 0.92rem;
      border-left: 5px solid #cbd5e1;
    }
    .history-item.is-correct {
      border-left-color: #10b981;
    }
    .history-item.is-wrong {
      border-left-color: #ef4444;
    }
    .history-q {
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.35rem;
      line-height: 1.4;
    }
    .history-ans-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .history-picked {
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
    }
    .history-picked.correct-pill {
      background: #dcfce7;
      color: #15803d;
    }
    .history-picked.wrong-pill {
      background: #fee2e2;
      color: #b91c1c;
    }
    .history-actual {
      background: #e0f2fe;
      color: #0369a1;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
    }

    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

          "Ôm vấn vương lưu lạc mộng trần trái ngang",

          "Con thuyền vẫn đợi bến, biết ai nhớ, ai đợi mong",
          "Thiên lý tương ngộ năng huyễn duyên ly mộng",
          "Đông Tây Nam Bắc, em giờ nơi đâu?",
          "Không gian chia cắt, sao mình xa nhau?",
          "Nhật Nguyệt tương khắc, anh chẳng buông đâu",
          "Phong sương phủ kín khuất lối chàng",
          "Vượt ngàn hải lý ta kiếm nàng"
        ]
      }

    const allTrackNames = Object.keys(songDatabase);

    // Preload rank badges
    const rankImagePaths = [
      "./Image/Rank_100.webp",
      "./Image/Rank_200.webp",
      "./Image/Rank_300.webp",
      "./Image/Rank_400.webp",
      "./Image/Rank_500.webp",
      "./Image/Rank_600.webp",
      "./Image/Rank_700.webp",
      "./Image/Rank_800.webp"
    ];
    rankImagePaths.forEach((src) => {
      const img = new Image();
      img.src = src;
    });

    // --- GAME STATE VARIABLES ---
    let score = 0;
    let streak = 0;
    let questionCount = 0;
    let chorusPool = [];
    let fullSongPool = [];
    let answeredHistory = [];

    // Initialize two distinct question pools
    function initQuestionPool() {
      chorusPool = [];
      fullSongPool = [];
      answeredHistory = [];
      questionCount = 0;

      allTrackNames.forEach((track) => {
        const chorusLines = songDatabase[track].chorus || [];
        const fullSongLines = songDatabase[track].fullSong || [];
        const chorusSet = new Set(chorusLines);

        chorusLines.forEach((line) => {
          chorusPool.push({ track, line });
        });

        fullSongLines.forEach((line) => {
          if (!chorusSet.has(line)) {
            fullSongPool.push({ track, line });
          }
        });
      });

      chorusPool.sort(() => 0.5 - Math.random());
      fullSongPool.sort(() => 0.5 - Math.random());
    }

    // 8 Tier Rank Badges
    function getScoreImage(finalScore) {
      const tiers = [
        { threshold: 100, img: "./Image/Rank_100.webp" },
        { threshold: 200, img: "./Image/Rank_200.webp" },
        { threshold: 300, img: "./Image/Rank_300.webp" },
        { threshold: 400, img: "./Image/Rank_400.webp" },
        { threshold: 500, img: "./Image/Rank_500.webp" },
        { threshold: 600, img: "./Image/Rank_600.webp" },
        { threshold: 700, img: "./Image/Rank_700.webp" },
        { threshold: 800, img: "./Image/Rank_800.webp" }
      ];

      for (const tier of tiers) {
        if (finalScore < tier.threshold) {
          return tier.img;
        }
      }
      return "./Image/Rank_800.webp";
    }

    // --- WELCOME SCREEN ---
    function showWelcomeScreen() {
      const card = document.getElementById("game-card");
      card.innerHTML = `
        <div class="welcome-container">
          <div class="welcome-title">🎵 GUESS THE SONG</div>
          <p class="welcome-subtitle">Thử thách trí nhớ lời bài hát Anh Trai "Say Hi"!</p>

          <div class="welcome-info-box">
            <div class="welcome-info-item">
              <span class="welcome-info-icon">🎶</span>
              <span><strong>30 câu đầu tiên:</strong> Thử thách riêng các đoạn Điệp Khúc (Chorus).</span>
            </div>
            <div class="welcome-info-item">
              <span class="welcome-info-icon">🔥</span>
              <span><strong>Từ câu 31 trở đi:</strong> Mở khóa toàn bộ các câu hát trong bài hát.</span>
            </div>
            <div class="welcome-info-item">
              <span class="welcome-info-icon">🚫</span>
              <span>Mỗi câu hát chỉ xuất hiện duy nhất 1 lần mỗi ván đấu.</span>
            </div>
            <div class="welcome-info-item">
              <span class="welcome-info-icon">🏆</span>
              <span>10 điểm mỗi câu đúng. Sai 1 câu là dừng lại và ghi điểm!</span>
            </div>
          </div>

          <button class="btn-start" onclick="startGame()">BẮT ĐẦU CHƠI</button>
        </div>
      `;
    }

    // --- START GAME ---
    function startGame() {
      score = 0;
      streak = 0;
      initQuestionPool();

      const card = document.getElementById("game-card");
      card.innerHTML = `
        <div class="status-bar">
          <div class="pill-badge score-badge">
            <span>⭐ ĐIỂM:</span> <span id="score-val">0</span>
          </div>
          <div class="pill-badge streak-badge" id="streak-val">
            🔥 CHUỖI: 0
          </div>
        </div>

        <div class="quote-box">
          <div class="quote-label" id="phase-label">🎵 Câu hát này nằm trong bài hát nào?</div>
          <div class="lyric-text" id="lyric-display">"..."</div>
        </div>

        <div class="options-grid" id="options-box"></div>
      `;

      nextTurn();
    }

    // --- NEXT QUESTION TURN ---
    function nextTurn() {
      questionCount++;

      let currentQ;

      if (questionCount <= 30 && chorusPool.length > 0) {
        currentQ = chorusPool.pop();
      } else if (fullSongPool.length > 0) {
        currentQ = fullSongPool.pop();
      } else if (chorusPool.length > 0) {
        currentQ = chorusPool.pop();
      } else {
        showGameOverScreen(null, true);
        return;
      }

      const targetTrack = currentQ.track;
      const chosenLine = currentQ.line;

      const phaseText = questionCount <= 30 ? "🎵 ĐIỆP KHÚC (CHORUS) - Bài hát nào?" : "🎶 TOÀN BÀI - Bài hát nào?";
      document.getElementById("phase-label").textContent = phaseText;
      document.getElementById("lyric-display").textContent = `"${chosenLine}"`;

      const otherTracks = allTrackNames.filter(name => name !== targetTrack);
      const distractors = otherTracks.sort(() => 0.5 - Math.random()).slice(0, 3);
      const choices = [...distractors, targetTrack].sort(() => 0.5 - Math.random());

      const container = document.getElementById("options-box");
      container.innerHTML = "";

      choices.forEach((trackTitle) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.dataset.track = trackTitle;
        btn.textContent = trackTitle;
        btn.onclick = () => handlePick(btn, trackTitle, targetTrack, chosenLine);
        container.appendChild(btn);
      });
    }

    // --- HANDLE ANSWER SELECTION ---
    function handlePick(selectedBtn, chosenTitle, correctTitle, lyricLine) {
      const buttons = document.querySelectorAll(".choice-btn");
      buttons.forEach(b => (b.disabled = true));

      const isCorrect = (chosenTitle === correctTitle);

      answeredHistory.push({
        line: lyricLine,
        picked: chosenTitle,
        correct: correctTitle,
        isCorrect: isCorrect
      });

      if (isCorrect) {
        selectedBtn.classList.add("correct");
        buttons.forEach(b => {
          if (b !== selectedBtn) {
            b.classList.add("dimmed");
          }
        });

        score += 10;
        streak += 1;
        document.getElementById("score-val").textContent = score;
        document.getElementById("streak-val").textContent = `🔥 CHUỖI: ${streak}`;

        setTimeout(() => {
          nextTurn();
        }, 700);
      } else {
        selectedBtn.classList.add("wrong");
        buttons.forEach(b => {
          if (b.dataset.track === correctTitle) {
            b.classList.add("correct");
          } else if (b !== selectedBtn) {
            b.classList.add("dimmed");
          }
        });

        setTimeout(() => {
          showGameOverScreen(correctTitle, false);
        }, 1200);
      }
    }

    // --- 3. SUPABASE CLOUD LEADERBOARD ---
    async function fetchCloudLeaderboard() {
      try {
        const { data, error } = await supabaseClient
          .from("leaderboard")
          .select("name, score, created_at")
          .order("score", { ascending: false })
          .limit(10);

        if (error) throw error;
        return data || [];
      } catch (err) {
        console.error("Lỗi khi tải bảng xếp hạng:", err);
        return [];
      }
    }

    async function saveScoreToCloud(name, finalScore) {
      try {
        const cleanName = name.trim() || "Ẩn danh";

        const { data: existingPlayers, error: fetchErr } = await supabaseClient
          .from("leaderboard")
          .select("id, score")
          .ilike("name", cleanName)
          .limit(1);

        if (fetchErr) throw fetchErr;

        if (existingPlayers && existingPlayers.length > 0) {
          const record = existingPlayers[0];
          if (finalScore > record.score) {
            const { error: updateErr } = await supabaseClient
              .from("leaderboard")
              .update({
                score: finalScore,
                created_at: new Date().toISOString()
              })
              .eq("id", record.id);

            if (updateErr) throw updateErr;
          }
          return true;
        } else {
          const { error: insertErr } = await supabaseClient
            .from("leaderboard")
            .insert([
              { name: cleanName, score: finalScore }
            ]);

          if (insertErr) throw insertErr;
          return true;
        }
      } catch (err) {
        console.error("Lỗi khi lưu điểm:", err);
        return false;
      }
    }

    async function renderLeaderboardTable() {
      const list = await fetchCloudLeaderboard();
      if (list.length === 0) {
        return `<p style="color: #64748b; text-align: center; margin: 1rem 0;">Chưa có kỷ lục nào được ghi nhận.</p>`;
      }

      let rows = list.map((item, index) => {
        const dateStr = new Date(item.created_at).toLocaleDateString("vi-VN");
        let medal = `#${index + 1}`;
        if (index === 0) medal = "🥇 #1";
        if (index === 1) medal = "🥈 #2";
        if (index === 2) medal = "🥉 #3";

        return `
          <tr>
            <td>${medal}</td>
            <td>${item.name}</td>
            <td><strong>${item.score}</strong></td>
            <td style="color: #94a3b8; font-size: 0.85rem;">${dateStr}</td>
          </tr>
        `;
      }).join("");

      return `
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>Top</th>
              <th>Người chơi</th>
              <th>Điểm</th>
              <th>Ngày</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    // --- GAME OVER SCREEN ---
    async function showGameOverScreen(correctTitle, isVictory = false) {
      const card = document.getElementById("game-card");
      const badgeImgUrl = getScoreImage(score);

      let historyItemsHtml = "";
      if (answeredHistory.length > 0) {
        historyItemsHtml = answeredHistory.map((item, idx) => {
          const statusClass = item.isCorrect ? "is-correct" : "is-wrong";
          const icon = item.isCorrect ? "✅" : "❌";
          const pillClass = item.isCorrect ? "correct-pill" : "wrong-pill";

          return `
            <div class="history-item ${statusClass}">
              <div class="history-q">${icon} <strong>Câu ${idx + 1}:</strong> "${item.line}"</div>
              <div class="history-ans-row">
                <span class="history-picked ${pillClass}">Bạn chọn: ${item.picked}</span>
                ${!item.isCorrect ? `<span class="history-actual">Đáp án đúng: ${item.correct}</span>` : ""}
              </div>
            </div>
          `;
        }).join("");
      } else {
        historyItemsHtml = `<p style="color: #94a3b8; text-align: center; font-size: 0.9rem;">Chưa có câu trả lời nào.</p>`;
      }

      const headerText = isVictory ? "XUẤT SẮC! BẠN ĐÃ CHIẾN THẮNG!" : "SAI GÒI!";
      const headerColor = isVictory ? "var(--kahoot-green)" : "var(--kahoot-red)";
      const answerBanner = (!isVictory && correctTitle) ? `
        <div class="correct-answer-banner">
          Đáp án đúng câu vừa rồi: <strong>${correctTitle}</strong>
        </div>
      ` : "";

      card.innerHTML = `
        <div class="game-over-header" style="color: ${headerColor};">${headerText}</div>
        
        ${answerBanner}

        <div class="rank-badge-container">
          <img src="${badgeImgUrl}" alt="Rank Badge" class="rank-badge-img" onerror="this.style.display='none'" />
        </div>

        <div class="score-summary">${score} Điểm</div>

        <div id="save-section">
          <div class="name-input-group">
            <input type="text" id="player-name" placeholder="Nhập tên của bạn để lưu điểm" maxlength="20" />
            <button class="btn-save" id="btn-save-action" onclick="handleSaveScore()">Lưu</button>
          </div>
        </div>

        <div class="leaderboard-title">
          <span>🏆 BẢNG XẾP HẠNG</span>
          <span style="font-size: 0.85rem; color: #64748b;">(Top 10)</span>
        </div>
        <div id="board-container">
          <p style="text-align: center; color: #94a3b8; margin: 1rem 0;">Đang tải bảng điểm...</p>
        </div>

        <button class="btn-restart" onclick="startGame()">Đấu lại ván mới</button>

        <!-- Review Answered Questions at the Bottom -->
        <div class="history-card">
          <div class="history-title">
            <span>📝 CÁC CÂU ĐÃ TRẢ LỜI (${answeredHistory.length})</span>
            <span style="font-size: 0.85rem; color: #64748b;">${answeredHistory.filter(h => h.isCorrect).length} Đúng / ${answeredHistory.length}</span>
          </div>
          <div class="history-list">
            ${historyItemsHtml}
          </div>
        </div>
      `;

      document.getElementById("board-container").innerHTML = await renderLeaderboardTable();
    }

    async function handleSaveScore() {
      const nameInput = document.getElementById("player-name");
      const saveBtn = document.getElementById("btn-save-action");
      const name = nameInput.value;

      saveBtn.disabled = true;
      saveBtn.textContent = "...";

      const success = await saveScoreToCloud(name, score);
      if (success) {
        document.getElementById("save-section").innerHTML = `
          <p style="text-align: center; color: #0284c7; font-weight: 700; margin-bottom: 1.25rem;">
            Đã đồng bộ điểm số lên đám mây thành công!
          </p>
        `;
        document.getElementById("board-container").innerHTML = await renderLeaderboardTable();
      } else {
        alert("Không thể lưu điểm lên database. Vui lòng kiểm tra lại kết nối hoặc Supabase keys.");
        saveBtn.disabled = false;
        saveBtn.textContent = "Lưu";
      }
    }

    // Initialize with Welcome Screen
    showWelcomeScreen();
  </script>
