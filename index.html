<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Song Memory Battle - Cloud Leaderboard</title>
  <!-- Load Supabase JS Client directly via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 15%, #1e1b4b, #090d16);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.25rem;
    }
    .quiz-card {
      background: rgba(30, 41, 59, 0.96);
      border: 1px solid #334155;
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 2.25rem 2rem;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .score-badge { color: #38bdf8; }
    .streak-badge { color: #facc15; }
    .quote-box {
      background: #0f172a;
      border-left: 4px solid #38bdf8;
      border-radius: 14px;
      padding: 1.6rem;
      margin-bottom: 1.75rem;
    }
    .quote-label {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      margin-bottom: 0.75rem;
    }
    .lyric-text {
      font-size: 1.35rem;
      line-height: 1.6;
      font-weight: 600;
      color: #ffffff;
      font-style: italic;
    }
    .options-grid {
      display: grid;
      gap: 0.85rem;
    }
    .choice-btn {
      background: #334155;
      color: #f1f5f9;
      border: 1px solid #475569;
      padding: 1.05rem 1.25rem;
      border-radius: 12px;
      font-size: 1.05rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.15s ease-in-out;
    }
    .choice-btn:hover:not(:disabled) {
      background: #475569;
      border-color: #64748b;
      transform: translateY(-2px);
    }
    .choice-btn .choice-prefix {
      font-weight: 800;
      color: #94a3b8;
      margin-right: 0.85rem;
    }
    .choice-btn.correct {
      background: #15803d !important;
      border-color: #22c55e !important;
      color: #fff !important;
    }
    .choice-btn.wrong {
      background: #991b1b !important;
      border-color: #ef4444 !important;
      color: #fff !important;
    }
    .game-over-header {
      text-align: center;
      font-size: 2rem;
      font-weight: 800;
      color: #ef4444;
      margin-bottom: 0.5rem;
    }
    .score-summary {
      text-align: center;
      font-size: 2.75rem;
      font-weight: 900;
      color: #38bdf8;
      margin: 0.75rem 0 1.25rem 0;
    }
    .name-input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
    }
    .btn-save {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 0 1.25rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-save:hover { background: #0369a1; }
    .leaderboard-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #facc15;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
    }
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .leaderboard-table th, .leaderboard-table td {
      padding: 0.65rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid #334155;
    }
    .leaderboard-table th {
      color: #94a3b8;
      font-weight: 600;
    }
    .leaderboard-table tr:first-child td {
      color: #facc15;
      font-weight: 700;
    }
    .btn-restart {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 1rem;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
    .btn-restart:hover { opacity: 0.92; }
  </style>
</head>

        "Ngàn lời thương trao em chẳng phai nhòa",
        "Dệt trọn một đời son sắt bên nhau"
      ],
      "50 Cuộc Gọi Nhỡ": [

        "Từng dòng tin nhắn gửi gắm hy vọng mong manh",
        "Biết em đã rời xa nhưng lòng chẳng thể buông",
        "Chỉ muốn nghe lại một lần giọng nói thân quen"
      ],
      "Mộng Duyên": [

        "Người đi xa mãi để lại nỗi chơi vơi",
        "Trách sao duyên phận lỡ dở đôi bờ",
        "Một đời tương tư ôm trọn giấc mơ tàn"
      ]
    };

    const allTrackNames = Object.keys(songDatabase);
    let score = 0;
    let streak = 0;
    let lastLyric = "";

    function getRandomElement(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function nextTurn() {
      const playableTracks = allTrackNames.filter(name => songDatabase[name].length > 0);
      const targetTrack = getRandomElement(playableTracks);
      const lines = songDatabase[targetTrack];

      let chosenLine = "";
      do {
        chosenLine = getRandomElement(lines);
      } while (chosenLine === lastLyric && lines.length > 1);
      lastLyric = chosenLine;

      document.getElementById("lyric-display").textContent = `"${chosenLine}"`;

      const otherTracks = allTrackNames.filter(name => name !== targetTrack);
      const distractors = otherTracks.sort(() => 0.5 - Math.random()).slice(0, 3);
      const choices = [...distractors, targetTrack].sort(() => 0.5 - Math.random());

      const container = document.getElementById("options-box");
      container.innerHTML = "";

      choices.forEach((trackTitle, idx) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.dataset.track = trackTitle;
        btn.innerHTML = `<span class="choice-prefix">${String.fromCharCode(65 + idx)}.</span> <span>${trackTitle}</span>`;
        btn.onclick = () => handlePick(btn, trackTitle, targetTrack);
        container.appendChild(btn);
      });
    }

    function handlePick(selectedBtn, chosenTitle, correctTitle) {
      const buttons = document.querySelectorAll(".choice-btn");
      buttons.forEach(b => (b.disabled = true));

      if (chosenTitle === correctTitle) {
        selectedBtn.classList.add("correct");
        score += 10;
        streak += 1;
        document.getElementById("score-val").textContent = score;
        document.getElementById("streak-val").textContent = `🔥 Chuỗi: ${streak}`;

        setTimeout(() => {
          nextTurn();
        }, 700);
      } else {
        selectedBtn.classList.add("wrong");
        buttons.forEach(b => {
          if (b.dataset.track === correctTitle) {
            b.classList.add("correct");
          }
        });

        setTimeout(() => {
          showGameOverScreen(correctTitle);
        }, 1200);
      }
    }

    // --- 3. CLOUD DATABASE FUNCTIONS ---
    async function fetchCloudLeaderboard() {
      try {
        const { data, error } = await supabaseClient
          .from("leaderboard")
          .select("name, score, created_at")
          .order("score", { ascending: false })
          .limit(10);

        if (error) throw error;
        return data || [];
      } catch (err) {
        console.error("Lỗi khi tải bảng xếp hạng:", err);
        return [];
      }
    }

    async function saveScoreToCloud(name, finalScore) {
      try {
        const { error } = await supabaseClient
          .from("leaderboard")
          .insert([
            { name: name.trim() || "Ẩn danh", score: finalScore }
          ]);

        if (error) throw error;
        return true;
      } catch (err) {
        console.error("Lỗi khi lưu điểm:", err);
        return false;
      }
    }

    async function renderLeaderboardTable() {
      const list = await fetchCloudLeaderboard();
      if (list.length === 0) {
        return `<p style="color: #64748b; text-align: center; margin: 1rem 0;">Chưa có kỷ lục nào được ghi nhận.</p>`;
      }

      let rows = list.map((item, index) => {
        const dateStr = new Date(item.created_at).toLocaleDateString("vi-VN");
        return `
          <tr>
            <td>#${index + 1}</td>
            <td>${item.name}</td>
            <td><strong>${item.score}</strong></td>
            <td style="color: #64748b; font-size: 0.85rem;">${dateStr}</td>
          </tr>
        `;
      }).join("");

      return `
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>Top</th>
              <th>Người chơi</th>
              <th>Điểm</th>
              <th>Ngày</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    async function showGameOverScreen(correctTitle) {
      const card = document.getElementById("game-card");
      card.innerHTML = `
        <div class="game-over-header">BẠN ĐÃ CHỌN SAI!</div>
        <p style="text-align: center; color: #94a3b8; font-size: 0.95rem;">
          Đáp án đúng: <strong style="color: #22c55e;">${correctTitle}</strong>
        </p>
        <div class="score-summary">${score} Điểm</div>

        <div id="save-section">
          <div class="name-input-group">
            <input type="text" id="player-name" placeholder="Nhập tên của bạn để lưu điểm toàn cầu..." maxlength="20" />
            <button class="btn-save" id="btn-save-action" onclick="handleSaveScore()">Lưu</button>
          </div>
        </div>

        <div class="leaderboard-title">
          <span>🏆 BẢNG XẾP HẠNG TOÀN CẦU</span>
          <span style="font-size: 0.85rem; color: #64748b;">(Top 10)</span>
        </div>
        <div id="board-container">
          <p style="text-align: center; color: #94a3b8; margin: 1rem 0;">Đang tải bảng điểm...</p>
        </div>

        <button class="btn-restart" onclick="location.reload()">Đấu lại ván mới</button>
      `;

      // Fetch and show top scores
      document.getElementById("board-container").innerHTML = await renderLeaderboardTable();
    }

    async function handleSaveScore() {
      const nameInput = document.getElementById("player-name");
      const saveBtn = document.getElementById("btn-save-action");
      const name = nameInput.value;

      saveBtn.disabled = true;
      saveBtn.textContent = "...";

      const success = await saveScoreToCloud(name, score);
      if (success) {
        document.getElementById("save-section").innerHTML = `
          <p style="text-align: center; color: #38bdf8; font-weight: 600; margin-bottom: 1.25rem;">
            Đã đồng bộ điểm số lên đám mây thành công!
          </p>
        `;
        document.getElementById("board-container").innerHTML = await renderLeaderboardTable();
      } else {
        alert("Không thể lưu điểm lên database. Vui lòng kiểm tra lại kết nối hoặc Supabase keys.");
        saveBtn.disabled = false;
        saveBtn.textContent = "Lưu";
      }
    }

    nextTurn();
  </script>
</body>
</html>
