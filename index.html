<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Song Memory Battle - Kahoot Edition</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Font: Nunito with full Vietnamese support -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --kahoot-red: #e21b3c;
      --kahoot-red-dark: #a01027;
      --kahoot-blue: #1368ce;
      --kahoot-blue-dark: #0b4386;
      --kahoot-yellow: #ffa602;
      --kahoot-yellow-dark: #b87400;
      --kahoot-green: #26890c;
      --kahoot-green-dark: #175407;
      --kahoot-purple: #46178f;
      --kahoot-purple-dark: #311064;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #46178f 0%, #250761 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before, body::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 70%);
      z-index: 0;
      pointer-events: none;
    }
    body::before { top: -60px; left: -80px; }
    body::after { bottom: -80px; right: -60px; }

    .quiz-card {
      background: #ffffff;
      color: #333333;
      border-radius: 28px;
      padding: 2rem 1.8rem;
      max-width: 720px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4), 0 8px 0 rgba(0, 0, 0, 0.15);
      position: relative;
      z-index: 1;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Welcome Screen Styles */
    .welcome-container {
      text-align: center;
      padding: 1.5rem 0.5rem;
    }
    .welcome-title {
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--kahoot-purple);
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    .welcome-subtitle {
      font-size: 1.15rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }
    .welcome-info-box {
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 18px;
      padding: 1.2rem;
      margin-bottom: 2rem;
      text-align: left;
    }
    .welcome-info-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 0.6rem;
    }
    .welcome-info-item:last-child {
      margin-bottom: 0;
    }
    .welcome-info-icon {
      font-size: 1.3rem;
    }
    .btn-start {
      width: 100%;
      background: var(--kahoot-green);
      box-shadow: 0 6px 0 var(--kahoot-green-dark);
      color: #ffffff;
      border: none;
      padding: 1.25rem 2rem;
      border-radius: 18px;
      font-family: inherit;
      font-size: 1.4rem;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: transform 0.08s, filter 0.15s, box-shadow 0.08s;
    }
    .btn-start:hover {
      filter: brightness(1.08);
    }
    .btn-start:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--kahoot-green-dark);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      gap: 0.5rem;
    }

    .pill-badge {
      font-size: 1.05rem;
      font-weight: 800;
      padding: 0.6rem 1.1rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    }
